name: CICD pipeline

on:
  push:
    branches:
      - master

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      #  Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      #  Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      #  Upgrade pip tools
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      #  Install project dependencies (ONLY ONCE)
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest awscli textblob

      #  Verify AWS credentials
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      #  Pull DVC artifacts
      - name: Pull DVC data
        run: dvc pull

      #  Run tests
      - name: Run model registry tests
        run: pytest tests/test_model_registry.py -v

      - name: Run model signature tests
        run: pytest tests/test_model_signature.py -v

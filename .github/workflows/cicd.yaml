name: CICD pipeline

on: [push]

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #  PIP CACHE (MOST IMPORTANT)
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]" boto3 awscli textblob

      #  NLP resources – only once cached by pip
      - name: Download NLP resources
        run: |
          python - <<EOF
          import nltk
          nltk.download("punkt")
          nltk.download("stopwords")
          EOF
          python -m textblob.download_corpora

      #  DVC CACHE
      - name: Restore DVC cache
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-cache-${{ hashFiles('dvc.lock') }}
          restore-keys: |
            dvc-cache-

      - name: Verify AWS
        run: aws sts get-caller-identity

      - name: Pull DVC outputs
        run: dvc pull

      #  ONLY FEATURE → downstream
      - name: Run pipeline from feature engineering
        run: dvc repro --downstream feature_engineering

      - name: Push DVC cache
        if: success()
        run: dvc push

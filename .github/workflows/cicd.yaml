name: CICD pipeline

on:
  push:
    branches:
     - master

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install dependencies (SAFE MODE)
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install awscli pytest textblob

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Pull DVC data
        run: dvc pull

      - name: Run model registry test
        run: pytest tests/test_model_registry.py

      - name: Run model signature test
        run: pytest tests/test_model_signature.py

name: CICD pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      #  Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      #  Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #  Cache pip (speed + stability)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      #  Install dependencies (SAFE RESOLVER MODE)
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt
          pip install awscli textblob pytest

      #  Cache DVC
      - name: Cache DVC
        uses: actions/cache@v4
        with:
          path: .dvc/cache
          key: dvc-cache-${{ hashFiles('dvc.lock') }}
          restore-keys: |
            dvc-cache-

      #  Verify AWS auth
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      #  Pull only required DVC artifacts
      - name: Pull DVC artifacts
        run: dvc pull -v

      #  Run model registry test
      - name: Run model loading test
        run: pytest tests/test_model_registry.py

      #  Run MLflow model signature test
      - name: Run model signature test
        run: pytest tests/test_model_signature.py
